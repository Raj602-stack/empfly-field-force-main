stages:
   - deploy
   - csi



Code Secrets Identifier:
  stage: csi
  image: hub-peerxp.vegaops.com/vegaops/docker-images/vegasecurity-ini-csi:latest
  script:
      - python3 /var/vegasecurity/csi/csi_specific.py
      - python3 /var/vegasecurity/csi/vegasec_sidekick.py
  artifacts:
    paths:
      - csi_report.json


.deploy-template: &deploy-template
  script:
       - cd $PROJECT_PATH
       - git config --global --add safe.directory $PROJECT_PATH
       - git checkout $CI_COMMIT_REF_NAME
       - git fetch $CI_REPOSITORY_URL
       - git pull $CI_REPOSITORY_URL $CI_COMMIT_BRANCH
       - chmod +x django-entrypoint.sh
       - chmod +x celery-entrypoint.sh
       - docker-compose --env-file .docker.env down
       - docker-compose --env-file .docker.env up -d  
  

